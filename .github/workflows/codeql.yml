# CodeQL: GitHub's security scanner reads our TypeScript/JavaScript and flags dangerous patterns
# (injection, unsafe HTML, leaked secrets…). Free for public repositories. Results: Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1" # every Monday, to catch newly discovered issues in unchanged code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
