<style>

.od .track{display:flex;gap:16px;list-style:none;margin:0;padding:6px max(40px,calc(50% - 580px)) 24px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 max(40px,calc(50% - 580px));scrollbar-width:none;scroll-behavior:smooth}

.od .foot{margin-top:28px}
.od[data-f="ateliere"] .tab[data-f="ateliere"]{background:var(--ink);color:#F4EDE4;border-color:var(--ink)}.od[data-f="ateliere"] .cd:not(.c-ateliere){display:none}.od[data-f="piese"] .tab[data-f="piese"]{background:var(--ink);color:#F4EDE4;border-color:var(--ink)}.od[data-f="piese"] .cd:not(.c-piese){display:none}.od[data-f="retreaturi"] .tab[data-f="retreaturi"]{background:var(--ink);color:#F4EDE4;border-color:var(--ink)}.od[data-f="retreaturi"] .cd:not(.c-retreaturi){display:none}
@media (max-width:820px){.od .bar{flex-direction:column;align-items:flex-start}.od .arrows{display:none}.od .track{padding:6px 20px 20px;scroll-padding:0 20px;gap:12px}.od .cd{width:250px;height:360px}.od .cd.hasq{width:300px}.od .ov{padding:90px 20px 22px}.od .ov blockquote{font-size:18px}}

e class="q"><svg class="qm" viewBox="0 0 32 24" aria-hidden="true"><path d="M0 24V14C0 6 4 1.5 12 0l1.4 3C8.6 4.4 6.6 7.2 6.4 11H12v13H0zm18 0V14c0-8 4-12.5 12-14l1.4 3c-4.8 1.4-6.8 4.2-7 8H30v13H18z" style="fill:currentColor"></path></svg><blockquote>Mi-a plăcut «intenția» cu care am pornit atelierul și faptul că acum obiectul semnifică ceva cu adevărat deosebit pentru fiecare.</blockquote><figcaption><b>Mădălina</b></figcaption></figure></div></li><li class="cd c-ateliere"><img src="/_blob/4b9ba5277b8dd3fad28a1395c891c1d1" alt="Un copil zâmbește, cu un vas de lut în mâini (fotografie provizorie)" style="object-position:60% 35%" loading="lazy"></li><li class="cd c-ateliere"><img src="/_blob/af69ff19bcdcf8c0410f4609e748d3a2" alt="Masa atelierului din octombrie văzută de sus, cu lut, căni și pensule" style="object-position:50% 50%" loading="lazy"></li><li class="cd c-piese"><img src="/_blob/74f239bfbd557a0a5a661ddd26484b66" alt="Boluri de ceramică arse, în culori diferite (fotografie provizorie)" style="object-position:50% 40%" loading="lazy"></li><li class="cd c-piese"><img src="/_blob/27d62de5381eeee8e9ab504567023c22" alt="Mâini care modelează un bol de lut (fotografie provizorie)" style="object-position:50% 40%" loading="lazy"></li><li class="cd c-piese"><img src="/_blob/18303291bcb407fd0b37b52607ecebba" alt="Mâini care își dau din mână în mână un vas de lut (fotografie provizorie)" style="object-position:50% 45%" loading="lazy"></li><li class="cd c-retreaturi"><img src="/_blob/8485d5712a94ed66603aeb86f80c0aac" alt="Cabană de lemn într-o pădure de pini (fotografie provizorie)" style="object-position:50% 60%" loading="lazy"></li><li class="cd c-retreaturi soon"><p>[poze și testimoniale de la retreaturi, imediat ce le ai]</p></li></ul>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this, r = this.root, reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (r) {
      var tabs = r.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-pressed', String(tabs[i].getAttribute('data-f') === r.getAttribute('data-f')));
    }
    if (!r || reduce || !r.hasAttribute('data-rotate')) return;
    r.addEventListener('pointerenter', function () { self.hold = true; });
    r.addEventListener('pointerleave', function () { self.hold = false; });
    this.timer = setInterval(function () {
      if (self.hold || Date.now() - (self.last || 0) < 12000) return;
      r.setAttribute('data-a', String((parseInt(r.getAttribute('data-a'), 10) + 1) % 3));
    }, 7000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var self = this;
    if (!this.cb) this.cb = {
      rootRef: function (el) { self.root = el; }, trackRef: function (el) { self.track = el; },
      pick: function (e) { self.last = Date.now(); self.root.setAttribute('data-a', e.currentTarget.getAttribute('data-i')); },
      step: function (e) {
        var n = parseInt(self.root.getAttribute('data-n'), 10), a = parseInt(self.root.getAttribute('data-a'), 10) + parseInt(e.currentTarget.getAttribute('data-d'), 10);
        self.root.setAttribute('data-a', String(Math.max(0, Math.min(n - 1, a))));
      },
      filter: function (e) {
        var f = e.currentTarget.getAttribute('data-f'); self.root.setAttribute('data-f', f);
        var tabs = self.root.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-pressed', String(tabs[i] === e.currentTarget));
        if (self.track) self.track.scrollLeft = 0;
      },
      scroll: function (e) { if (self.track) self.track.scrollBy({ left: 420 * parseInt(e.currentTarget.getAttribute('data-d'), 10), behavior: 'smooth' }); }
    };
    return this.cb;
  }
}
