<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Hanken+Grotesk:wght@300..700&amp;family=Newsreader:opsz,wght@6..72,200..800&amp;family=Host+Grotesk:wght@300..800&amp;family=Pinyon+Script&amp;display=swap">
<style>
body{margin:0;background:#F4EDE4}
.pg{--ink:#3A2A20;--ink2:#6B5444;--paper:#F4EDE4;--sand:#E6D5BD;--terra:#B4583A;--terra-d:#9C472C;--clay:#C07A4E;--glowc:#F2C79C;--display:'Bodoni Moda',Georgia,serif;--text:'Hanken Grotesk',system-ui,sans-serif;--script:'Pinyon Script',cursive;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--text);-webkit-font-smoothing:antialiased;overflow-x:clip}
.pg ::selection{background:#B4583A;color:#F4EDE4}
.pg a{color:inherit}
.pg a:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:4px}
.disp{font-family:var(--display);font-weight:400;font-variation-settings:'opsz' 20;letter-spacing:-.012em;text-wrap:balance;margin:0}
.disp em{font-style:italic}
.wrap{position:relative;max-width:1240px;margin:0 auto;padding:0 40px;box-sizing:border-box}
.ar{width:16px;height:16px;flex:none;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.more{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-top:18px;font-weight:500;text-decoration:none;text-underline-offset:6px;background:linear-gradient(currentColor,currentColor) 0 calc(100% - 9px)/100% 1px no-repeat;transition:background-size .3s cubic-bezier(.2,.7,.2,1)}
.more:hover{background-size:0 1px;background-position:100% calc(100% - 9px)}
.more:hover .ar{transform:translateX(4px)}
.body{margin:0;text-wrap:pretty;max-width:46ch}
.role{display:block;font:500 15px/1.45 var(--text);letter-spacing:.01em;max-width:34ch}
/* the bottom of the chosen hero, for context (light variants keep its cream wave) */
.heroend{position:relative;height:120px;background:#8A4A30 url(/_blob/a36432dd59596088ec01e9f25409bd5d) center 85%/cover no-repeat}
.heroend::before{content:"";position:absolute;inset:0;background:rgba(42,20,12,.45)}
.heroend svg{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:120px}
/* woodsprite + its warm halo, same recipe as the hero */
.glow{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle var(--lr,340px) at var(--lx,70%) var(--ly,40%),rgba(255,206,150,.30) 0%,rgba(255,180,110,.10) 40%,rgba(255,170,100,0) 70%);mix-blend-mode:screen}
.sprite{position:absolute;left:0;top:0;z-index:4;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#FFFDF6 0 35%,rgba(255,246,228,.9) 52%,rgba(255,236,206,0) 74%);box-shadow:0 0 16px 6px rgba(255,250,238,.85),0 0 60px 26px rgba(255,236,206,.4);will-change:transform}
@media (max-width:820px){.wrap{padding:0 20px}.heroend{height:72px}.heroend svg{height:72px}}
@media (prefers-reduced-motion:reduce){.sprite{display:none}.pg *{transition:none!important}}

.cr{position:relative;overflow:hidden;--spring:cubic-bezier(.3,1.32,.5,1);--soft:cubic-bezier(.22,1,.36,1)}
.cr h2{font-size:clamp(40px,4.4vw,64px);line-height:1.05}
.cr .ph{color:inherit;opacity:.8;font-size:16px;letter-spacing:.02em}

.cw{background:#F4EDE4;padding:112px 0 120px}
.cw h2{margin-bottom:44px}
.cw .row{display:flex;gap:16px;height:520px;margin:0;padding:0;list-style:none}
.cw .pn{position:relative;flex:1 1 0;min-width:0;container-type:inline-size;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:34px;border-radius:32px;corner-shape:squircle;background:var(--bg);color:#F7EFE5;
  transition:flex-grow .7s var(--spring)}
@media (hover:hover){.cw .row:hover .pn{flex-grow:.85}.cw .row .pn:hover{flex-grow:1.35}}
.cw .sh{position:absolute;right:-30px;top:-20px;width:300px;height:300px;fill:var(--ac);stroke:var(--ac);opacity:.9;animation:cw-float 9s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -3s);transition:scale .7s var(--spring)}
.cw .pn:hover .sh{scale:1.12}
@keyframes cw-float{from{translate:0 0;rotate:-6deg}to{translate:-24px 22px;rotate:8deg}}
.cw .w{display:block;overflow:hidden}
.cw .w span{display:block;font:400 min(64px,12.5cqi)/1 var(--display);font-variation-settings:'opsz' 60;letter-spacing:-.02em}
.cw .ph{position:relative;margin:14px 0 0}
@keyframes cw-rise{from{clip-path:inset(100% 0 0 0 round 32px)}to{clip-path:inset(0 0 0 0 round 32px)}}
@keyframes cw-word{from{translate:0 105%}}
.cw.js:not(.in) .pn{opacity:0}
.cw.js.in .pn{animation:cw-rise 1s var(--soft) backwards;animation-delay:calc(var(--i) * 140ms)}
.cw.js.in .w span{animation:cw-word .9s var(--soft) backwards;animation-delay:calc(var(--i) * 140ms + 380ms)}
@media (max-width:980px){.cw{padding:72px 0 80px}.cw h2{margin-bottom:28px}.cw .row{flex-direction:column;height:auto;gap:12px}.cw .pn{min-height:230px;padding:26px;border-radius:26px}.cw .sh{width:200px;height:200px}.cw .w span{font-size:min(46px,12.5cqi)}}
@media (prefers-reduced-motion:reduce){.cw *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="pg" data-src="Spotify Wrapped: panouri pline de culoare, cu forme mari care se mișcă">
<section class="cr cw" aria-labelledby="cr-h" ref="{{ secRef }}"><div class="wrap"><h2 class="disp" id="cr-h">Ce credem</h2><ul class="row"><li class="pn" style="--bg: #3A2A20; --ac: #B4583A; --i: 0"><svg class="sh" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="78"></circle></svg><h3 class="w"><span>Prezență</span></h3><p class="ph">[FRAZA PENTRU PREZENȚĂ]</p></li><li class="pn" style="--bg: #9C472C; --ac: #C07A4E; --i: 1"><svg class="sh" viewBox="0 0 200 200" aria-hidden="true"><circle cx="70" cy="110" r="52"></circle><circle cx="130" cy="110" r="52"></circle><circle cx="100" cy="62" r="52"></circle></svg><h3 class="w"><span>Comunitate</span></h3><p class="ph">[FRAZA PENTRU COMUNITATE]</p></li><li class="pn" style="--bg: #4F5A43; --ac: #6F7B5C; --i: 2"><svg class="sh" viewBox="0 0 200 200" aria-hidden="true"><path d="M20 120C45 40 75 40 90 100S140 170 160 90S185 40 190 60" style="fill:none;stroke-width:22;stroke-linecap:round"></path></svg><h3 class="w"><span>Creativitate</span></h3><p class="ph">[FRAZA PENTRU CREATIVITATE]</p></li></ul></div></section>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1092}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this, s = this.sec; if (!s) return;
    var reduce = this.reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    s.classList.add('js');
    if (reduce || !window.IntersectionObserver) s.classList.add('in');
    else { this.io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { s.classList.add('in'); self.io.disconnect(); } }, { threshold: 0.25 }); this.io.observe(s); }
  }
  componentWillUnmount() { if (this.io) this.io.disconnect();  }
  renderVals() {
    var self = this;
    if (!this.cb) this.cb = { secRef: function (el) { self.sec = el; } };
    return this.cb;
  }
}
